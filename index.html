<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ruta individual · Jueves 8</title>
<style>
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f5ef;color:#21313a;margin:0;padding:22px}
#app{max-width:980px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}
h1{font-size:1.7rem;line-height:1.15;margin:.15rem 0 .35rem;font-weight:850}
.muted{color:#667085;font-size:.95rem;line-height:1.45}
.panel{border:1px solid #d9d1c2;border-radius:18px;background:#fffdf9;padding:16px;margin-top:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
button{min-height:44px;border-radius:12px;border:1px solid #d4cabb;background:#fff;color:#21313a;font-weight:750;padding:10px 12px;cursor:pointer}
button:hover{background:#faf7f1} button:focus-visible{outline:3px solid #5f8ea5;outline-offset:2px}
.name-btn{text-align:left} .name-btn small{display:block;margin-top:2px;color:#667085;font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.subject-btn[aria-current='true']{border-color:#5f8ea5;background:#eef5f8}
.subject-btn.done::after{content:' ✓';font-weight:900}
.subject-btn.math{border-top:4px solid #4f8158} .subject-btn.lang{border-top:4px solid #b5524c} .subject-btn.astro{border-top:4px solid #4b6a89}
.titlebar{display:inline-block;padding:7px 12px;border-radius:12px;font-weight:850;color:#fff;margin-bottom:8px}
.titlebar.math{background:#4f8158} .titlebar.lang{background:#b5524c} .titlebar.astro{background:#4b6a89}
.facts{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.facts li{border:1px solid #e4ddd1;border-radius:12px;padding:10px 12px;line-height:1.45;background:#fcfaf5}
.model{font-weight:800;line-height:1.5;font-size:1.02rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.primary{background:#eef5f8;border-color:#5f8ea5}
.question{padding:14px 0;border-bottom:1px solid #ece5da} .question:last-child{border-bottom:0}
.qnum{font-size:.76rem;font-weight:850;letter-spacing:.06em;text-transform:uppercase;color:#6b7280}
.prompt{font-size:1.02rem;font-weight:760;line-height:1.48;margin:.35rem 0 .7rem;white-space:pre-line}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.option{text-align:center;font-weight:680} .option.correct{border-color:#4f8158;background:#edf7ef}
.feedback{margin-top:8px;font-size:.9rem;font-weight:780;min-height:1.25rem} .feedback.ok{color:#2f6a38} .feedback.no{color:#9a3a35}
.code{margin-top:14px;border:1px dashed #d9d1c2;border-radius:14px;padding:12px;background:#fcfaf5}
.finish{margin-top:14px;border-radius:14px;padding:14px;background:#eef5f8;font-weight:820}
.progress{display:inline-flex;gap:5px;align-items:center;margin-left:4px} .dot{width:10px;height:10px;border-radius:50%;border:1px solid #d1c7b8} .dot.on{background:#5f8ea5;border-color:#5f8ea5}
.switch{background:transparent}
.upper{text-transform:uppercase}
.image-card{margin-top:12px;border:1px solid #d9d1c2;border-radius:16px;overflow:hidden;background:#fff}
.image-card img{display:block;width:100%;height:auto;background:#0d1930}
.image-caption{padding:10px 12px;background:#fcfaf5;border-top:1px solid #e7ded0}
.look{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.look li{background:#eef5f8;border:1px solid #d7e6ec;border-radius:12px;padding:9px 11px;font-weight:700}
.mini-note{font-size:.92rem;color:#4f5b67;line-height:1.45}
@media(max-width:680px){body{padding:12px} .names,.options{grid-template-columns:1fr} .panel{padding:13px} h1{font-size:1.45rem} }
</style></head>

 if(state.phase==='learn'){body=`<div class='panel'><div class='titlebar ${state.sub}'>${LABELS[state.sub]}</div><div class='eyebrow'>Primero aprendemos</div><ul class='facts'>${subj.learn.map(x=>`<li>${x}</li>`).join('')}</ul><div class='panel' style='margin-top:12px;padding:14px;background:#fcfaf5'><div class='eyebrow'>Miro un ejemplo</div><div class='model'>${subj.example}</div></div>${extra}<div class='actions'><button type='button' id='practice' class='primary'>Ya lo leí · practicar</button></div></div>`;}
 else{body=`<div class='panel'><div class='titlebar ${state.sub}'>${LABELS[state.sub]}</div>${extra}${subj.qs.map((q,i)=>`<div class='question'><div class='qnum'>Pregunta ${i+1} de ${subj.qs.length}</div><div class='prompt'>${q.p}</div><div class='options'>${q.o.map(o=>`<button type='button' class='option ${state.done[state.sub].has(i)&&o===q.a?'correct':''}' data-i='${i}' data-opt='${encodeURIComponent(o)}' ${state.done[state.sub].has(i)?'disabled':''}>${o}</button>`).join('')}</div><div class='feedback ${state.done[state.sub].has(i)?'ok':(state.feedback[state.sub][i]?'no':'')}' aria-live='polite'>${state.feedback[state.sub][i]||''}</div></div>`).join('')}${complete(state.sub)?`<div class='code'>Área completa. Copia en tu ficha la palabra: <strong>${CODES[state.sub]}</strong></div>`:''}<div class='actions'><button type='button' id='backLearn'>Volver a la explicación</button></div></div>`;}
 app.innerHTML=`<div class='${wrap}'><div class='top'><div><div class='eyebrow'>${state.student}</div><h1>Aprendo antes de responder</h1><div class='muted'>Lee la explicación. En Astronomía, varias preguntas se responden mirando el panel visual.</div></div><button type='button' class='switch' id='switch'>Cambiar nivel</button></div><div class='toolbar'>${['math','lang','astro'].map(s=>`<button type='button' class='subject-btn ${s} ${complete(s)?'done':''}' data-sub='${s}' aria-current='${state.sub===s}'>${LABELS[s]}</button>`).join('')}<span class='progress'>${[0,1,2].map(i=>`<span class='dot ${i<count?'on':''}'></span>`).join('')}</span></div>${body}${allDone()?`<div class='finish'>Ruta completa. Ahora realiza el registro físico en tu cuaderno.</div>`:''}</div>`;
 app.querySelector('#switch').addEventListener('click',()=>{state.student=null;render();});
 app.querySelectorAll('[data-sub]').forEach(b=>b.addEventListener('click',()=>{state.sub=b.dataset.sub;state.phase='learn';render();}));
 const p=app.querySelector('#practice'); if(p) p.addEventListener('click',()=>{state.phase='practice';render();});
 const bl=app.querySelector('#backLearn'); if(bl) bl.addEventListener('click',()=>{state.phase='learn';render();});
 app.querySelectorAll('.option:not([disabled])').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.i), decodeURIComponent(b.dataset.opt))));
}
render();
</script></body></html>
