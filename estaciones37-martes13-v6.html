"],["bueno","","BUENO"],["gigante","","GIGANTE"]],"answer":"bueno","help":"LEE LAS DOS PALABRAS «LOBITO BUENO» EN EL CLE."},{"kind":"choice","q":"¿QUIÉNES MALTRATABAN AL LOBITO?","options":[["corderos","🐑","LOS CORDEROS"],["pirata","🏴‍☠️","EL PIRATA"],["bruja","🧙‍♀️","LA BRUJA"]],"answer":"corderos","help":"MIRA LA IMAGEN DEL LOBITO JUNTO A DOS ANIMALES BLANCOS.","source":true},{"kind":"oral","q":"INDICA O ESCRIBE: EL LOBITO ES BUENO.","scaffold":"USA EL BANCO: EL / LOBITO / ES / BUENO. SI LO NECESITAS, ESCUCHA CADA PALABRA.","notebook":"COMPLETA EN TU FICHA: «EL LOBITO ES ______». SEÑALA LA PISTA."}]},"matematica":{"heading":"SALTOS Y CASILLAS","goal":"Avanzar de 10 en 10, anticipar resultados y comprobar la regla al pasar de 94 a 104.","work":"CHM de 2.º, p. 48; tabla adaptada con salida 34, carta +10 y SIETE resultados; luego 26 → 36 → 46 → 56 → 66.","tasks":[{"kind":"choice","q":"NÚMERO DE SALIDA 34. AVANZA 10. ¿A QUÉ NÚMERO LLEGAS?","options":[["35","","35"],["44","","44"],["43","","43"]],"answer":"44","help":"MIRA LAS DECENAS: TRES DECENAS PASAN A CUATRO."},{"kind":"stepper","q":"COMPLETA LOS SIETE SALTOS DE 10 EN 10 DESDE 34.","start":34,"delta":10,"steps":7,"help":"SUMA DIEZ AL ÚLTIMO NÚMERO. CUANDO PASAS DE 94, TIENES 104."},{"kind":"choice","q":"COMPLETA: 26 → 36 → 46 → ¿QUÉ SIGUE?","options":[["47","","47"],["56","","56"],["66","","66"]],"answer":"56","help":"CADA FLECHA AVANZA DIEZ. DESPUÉS DE 46 VA 56."},{"kind":"oral","q":"¿QUÉ CAMBIÓ CUANDO PASASTE DE 94 A 104?","scaffold":"USA EL CUADRO NUMÉRICO O DIEZ PALITOS SI LOS NECESITAS. OBSERVA QUÉ PASA AL CAMBIAR LA CENTENA.","notebook":"EN LA HOJA DEL MARTES: ESCRIBE LOS SIETE RESULTADOS. LUEGO COMPLETA 41 → 51 → 61 → 71."}]}},"tercero":{"lengua":{"heading":"Encontrar información y pistas","goal":"Organizar información explícita e indicar qué personaje resultó inesperado usando el texto.","work":"Ficha de el estudiante: personaje / qué dice el poema; «Me sorprendió… / Lo compruebo en…».","tasks":[{"kind":"c function newRecord(){return {selected:[],attempts:0,rounds:0,completed:false,replay:false,hint:false,step:0,first:null,correct:false}}

function voiceButton(txt,label='🔊 ESCUCHAR'){return `<button class="btn audio" data-speech="${esc(txt)}" type="button">${label}</button>`}
function completedBadge(record){return record.completed?`<div class="status">⭐ SUPERADA</div><p class="repeatnote">La hiciste ${record.rounds} ${record.rounds===1?'vez':'veces'}. Puedes practicar otra vez antes de seguir.</p>`:''}
function optionsUI(t,record,stage){const disabled=record.completed&&!record.replay;const selected=record.selected||[];let h=`<h3>${esc(t.q)}</h3><div class="listenbar">${voiceButton(t.q,'🔊 ESCUCHAR CONSIGNA')}${voiceButton(t.q+' '+(t.options||[]).map((o,i)=>'Opción '+(i+1)+': '+o[2]).join('. '),'🔊 ESCUCHAR OPCIONES')}</div>`;if(t.dots)h+=`<div class="visual-dots">${Array(t.dots).fill('●').join(' ')}</div>`;if(t.kind==='multi')h+='<p class="muted tiny">Puede haber más de una respuesta correcta.</p>';h+='<div class="options">'+(t.options||[]).map(([id,emoji,label])=>`<div class="optwrap"><button class="opt ${selected.includes(id)?'chosen':''}" type="button" aria-pressed="${selected.includes(id)}" ${disabled?'disabled':''} data-choice="${esc(id)}" data-stage="${stage}">${emoji?`<span class="opt-emoji" aria-hidden="true">${emoji}</span>`:''}<span>${esc(label)}</span></button>${voiceButton(label,'🔊 OÍR')}</div>`).join('')+'</div>';return h}
function stepperUI(t,rec,stage){const nums=[t.start];for(let i=1;i<=t.steps;i++)nums.push(i<=rec.step?t.start+t.delta*i:'?');let h=`<h3>${esc(t.q)}</h3><div class="listenbar">${voiceButton(t.q)}</div><div class="digitline">${nums.map((x,i)=>`<span class="digit ${i<=rec.step?'known':''}">${x}</span>`).join('')}</div>`;if(!rec.completed||rec.replay){const next=t.start+t.delta*(rec.step+1);if(rec.step<t.steps){let opts=[next,next-t.delta,next+1];opts=[...new Set(opts)];h+='<p class="muted">Elige el próximo número. Puedes repetir los siete saltos.</p><div class="options">'+opts.map(v=>`<div class="optwrap"><button class="opt" data-choice="${v}" data-stage="${stage}" type="button">${v}</button>${voiceButton('Número '+v,'🔊 OÍR')}</div>`).join('')+'</div>'}}return h}
function badgeStage(n,title,unlocked,isDone){return `<section class="panel ${unlocked?'':'locked'}" id="etapa${n}"><h2>${n} · ${title}</h2>${!unlocked?'<p>🔒 Se habilita cuando termines la etapa anterior.</p>':''}`}
function taskControls(rec,stage,label='COMPROBAR'){let h='<div class="controls">';if(!rec.completed||rec.replay){if(stage!=='practice0'||true) h+=`<button type="button" class="btn primary" data-action="check" data-stage="${stage}">${label}</button>`;h+=`<button type="button" class="btn" data-action="help" data-stage="${stage}">💡 PISTA</button>`}if(rec.completed)h+=`<button type="button" class="btn secondary" data-action="repeat" data-stage="${stage}">↶ VOLVER A HACER ESTA ACTIVIDAD</button>`;h+='</div>';return h}
function activeStatus(rec){return rec.completed&&!rec.replay}
function applyUppercase(){
 document.body.classList.toggle('allcaps',isCaps());
 if(!isCaps())return;
 const root=$('#app');const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
 while((n=walk.nextNode())){if(n.parentElement?.tagName==='TEXTAREA')continue;n.nodeValue=n.nodeValue.toLocaleUpperCase('es-UY');}
 root.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(el=>{for(const key of ['placeholder','aria-label','title','alt'])if(el.hasAttribute(key))el.setAttribute(key,el.getAttribute(key).toLocaleUpperCase('es-UY'));});
 root.querySelectorAll('textarea').forEach(el=>{el.value=el.value.toLocaleUpperCase('es-UY');});
}
function render(){const r=route(),c=course(),L=lesson(),t=c.tasks,done=completed(r);document.documentElement.style.setProperty('--accent',state.area==='lengua'?'var(--red)':'var(--green)');document.documentElement.style.setProperty('--soft',state.area==='lengua'?'var(--pink)':'var(--pale)');const name=learners.find(x=>x.id===state.student)?.name||'';const count=done.filter(Boolean).length;let h=`<header class="pagehead"><div class="eyebrow">${state.area==='lengua'?'LENGUA ESPAÑOLA':'MATEMÁTICA'} · RUTA COMPLETA · MARTES 13</div><p class="tiny">RESUELVE, PRACTICA LAS VECES QUE NECESITES Y DESPUÉS CONTINÚA. TODO QUEDA EN ESTA MISMA PÁGINA.</p><div class="toprow"><div><h1>${esc(c.heading)}</h1><p class="muted"><b>Mi meta:</b> ${esc(c.goal)}</p></div></div><div class="toolbar"><label class="label" for="person">ALUMNO/A</label>${learners.length>1?`<select id="person" aria-label="Alumno o ruta">${learners.map(p=>`<option value="${p.id}" ${state.student===p.id?'selected':''}>${esc(p.name)} · ${esc(p.grade)}</option>`).join('')}</select>`:`<span class="btn">${esc(name)} · ${esc(learners[0].grade)}</span>`}<label for="subject" class="label">ÁREA</label><select id="subject"><option value="lengua" ${state.area==='lengua'?'selected':''}>Lengua Española</option><option value="matematica" ${state.area==='matematica'?'selected':''}>Matemática</option></select><button type="button" class="btn audio" data-action="toggle-voice">${state.voice?'🔊 VOZ ACTIVADA':'🔇 ACTIVAR VOZ'}</button><button type="button" class="btn reset" data-action="reset">↻ REINICIAR RUTA</button></div><div class="stars"><span>MIS ESTRELLAS:</span><span class="icons" aria-label="${count} de 4 estrellas">${done.map(x=>`<span class="${x?'star-filled':'star-empty'}">${x?'★':'☆'}</span>`).join('')}</span><span>${count} DE 4</span></div><div class="stagerail">${['PRUEBO','APRENDO','AHORA LO HAGO YO','¿CÓMO LO HICE?'].map((title,i)=>`<div class="stagebadge ${done[i]?'done':i===0||done[i-1]?'next':''}">${i+1} · ${title}${done[i]?' ⭐':''}</div>`).join('')}</div>${!storageAvailable?'<p class="feedback warn">El navegador bloquea el guardado automático. Usa «Guardar registro» antes de salir.</p>':''}</header>`;
// 1
h+=badgeStage(1,'PRIMERO: PRUEBO',true,done[0]);h+='<p class="desc">RESUELVE CINCO ACTIVIDADES. CUANDO RESUELVES UNA, SE ABRE LA SIGUIENTE. PUEDES REPETIR CADA ACTIVIDAD TODAS LAS VECES QUE NECESITES. TU PRIMER INTENTO QUEDA REGISTRADO SIN NOTA.</p>';
const diagnosticTasks=DIAGNOSTICS[state.student][state.area];
for(let i=0;i<5;i++){
 const dr=r.diagnostic[i],unlocked=i===0||r.diagnostic[i-1].completed,dt=diagnosticTasks[i],stage='diagnostic'+i;
 h+=`<div class="task ${dr.completed?'completed':''}" id="pruebo${i+1}"><h3>ACTIVIDAD ${i+1}</h3>${completedBadge(dr)}`;
 if(!unlocked)h+='<p class="muted">🔒 PRIMERO TERMINA LA ACTIVIDAD ANTERIOR.</p>';
 else {
  h+=activeStatus(dr)?`<p>${esc(dt.q)}</p>`:optionsUI(dt,dr,stage);
  if(dr.hint)h+=`<div class="help">💡 ${esc(dt.help||'MIRA DE NUEVO LAS OPCIONES Y PRUEBA OTRA VEZ.')} ${voiceButton(dt.help||'MIRA DE NUEVO LAS OPCIONES Y PRUEBA OTRA VEZ.')}</div>`;
  h+=taskControls(dr,stage,'COMPROBAR');
 }
 h+='</div>';
}
h+='</section>';
// 2
h+=badgeStage(2,'DESPUÉS: APRENDO',done[0],done[1]);if(done[0]){h+='<p class="desc">Observo un ejemplo, escucho cómo se resuelve y pruebo para comprobar que comprendí.</p><div class="modelgrid">'+L.model.map((p,i)=>`<div class="modelcard"><b>PASO ${i+1} · ${esc(p[0])}</b><span class="visual">${esc(p[2])}</span><p>${esc(p[1])}</p>${voiceButton(p[0]+'. '+p[1]+'. '+p[2],'🔊 ESCUCHAR PASO')}</div>`).join('')+'</div>';if(r.mini.hint)h+=`<div class="help">${esc(L.bridge)} ${voiceButton(L.bridge)}</div>`;h+=`<div class="micro task ${r.mini.completed?'completed':''}"><h3>MICROCOMPROBACIÓN</h3>${completedBadge(r.mini)}`;if(!activeStatus(r.mini))h+=optionsUI(L.mini,r.mini,'mini');else h+=`<p>${esc(L.mini.q)}</p>`;if(r.mini.completed)h+=`<div class="feedback">${esc(L.mini.why)}</div>`;h+=taskControls(r.mini,'mini')+'</div>';}h+='</section>';
// 3
h+=badgeStage(3,'AHORA LO HAGO YO',done[1],done[2]);if(done[1]){h+='<p class="desc">Resuelvo cinco desafíos. <b>Puedo volver a hacerlos varias veces</b> antes de continuar. Si me equivoco, consulto la pista.</p>';for(let i=0;i<5;i++){const pr=r.practice[i],pt=practiceTask(i);const unlocked=i===0||r.practice[i-1].completed;h+=`<div class="task ${pr.completed?'completed':''}" id="desafio${i+1}"><h3>ACTIVIDAD ${i+1}</h3>${completedBadge(pr)}`;if(!unlocked){h+='<p class="muted">🔒 Primero termina la actividad anterior.</p>'}else{h+=activeStatus(pr)?`<p>${esc(pt.q)}</p>`:pt.kind==='stepper'?stepperUI(pt,pr,'practice'+i):optionsUI(pt,pr,'practice'+i);if(pr.hint)h+=`<div class="help">💡 ${esc(pt.help||'Revisa el ejemplo antes de responder.')} ${voiceButton(pt.help||'Revisa el ejemplo antes de responder.')}</div>`;h+=taskControls(pr,'practice'+i,pt.kind==='stepper'?'COMPROBAR SALTOS':'COMPROBAR');}h+='</div>';} }h+='</section>';
// 4
h+=badgeStage(4,'¿CÓMO LO HICE?',done[2],done[3]);if(done[2]){h+='<p class="desc">No hay respuesta incorrecta: elige la imagen que mejor cuenta cómo aprendiste. Puedes escuchar las tres opciones.</p>';h+=`<div class="task ${r.self.saved?'completed':''}"><h3>MI AUTOEVALUACIÓN</h3><p>${esc(t[3].q)}</p><div class="listenbar">${voiceButton(t[3].q,'🔊 ESCUCHAR PREGUNTA')}${voiceButton(t[3].scaffold,'🔊 ESCUCHAR AYUDA')}</div><div class="selfgrid">`;for(const [id,emoji,label] of [['sola','😊','LO HICE SOLA/O'],['pista','💡','NECESITÉ UNA PISTA'],['ayuda','🤝','NECESITÉ AYUDA']])h+=`<div><button type="button" class="selfopt ${r.self.choice===id?'chosen':''}" data-self="${id}" aria-pressed="${r.self.choice===id}"><span class="selfemoji">${emoji}</span><span>${label}</span></button>${voiceButton(label,'🔊 ESCUCHAR OPCIÓN')}</div>`;h+='</div><div class="help"><b>PUEDO EXPLICARLO ASÍ:</b> '+esc(t[3].scaffold)+'</div><label for="reflectText"><b>Si quiero, escribo mi explicación o la maestra anota lo que dije:</b></label><textarea id="reflectText" placeholder="Puedes dejar este espacio sin escribir si tu explicación es oral.">'+esc(r.self.text||'')+'</textarea><div class="controls"><button type="button" class="btn primary" data-action="save-self">⭐ GUARDAR MI AUTOEVALUACIÓN</button></div>';if(r.self.saved)h+='<p class="feedback">⭐ ¡Autoevaluación registrada! La maestra observará cómo resolviste y escuchará tu explicación si la diste oralmente.</p>';h+='</div>';}h+='</section>';
// finish and source
if(done[3])h+=`<section class="finish"><h3>⭐ ¡RECORRIDO COMPLETADO!</h3><p>Ya trabajaste las cuatro etapas. Puedes volver a repetir cualquier actividad sin borrar sus estrellas.</p><div class="info"><b>📓 EN EL CUADERNO:</b> ${esc(c.work)}</div><div class="controls"><button type="button" class="btn secondary" data-action="export">⬇ GUARDAR REGISTRO PARA LA MAESTRA</button><button type="button" class="btn primary" data-action="next-area">IR A ${state.area==='lengua'?'MATEMÁTICA':'LENGUA ESPAÑOLA'} →</button></div></section>`;
if(state.area==='lengua'){h+=`<section class="panel imagepanels"><h2>📚 MI CUADERNO DE LEER Y ESCRIBIR</h2>`;if(APP.mode==='public'){h+='<div class="info">Mira las páginas 12 y 13 del CLE de 2.º con tu maestra o en tu cuaderno. Las ilustraciones no están publicadas en este enlace.</div>'}else{h+=`<details><summary>MIRAR PÁGINAS 12 Y 13 ORIGINALES DEL CLE (SIN MODIFICAR)</summary>${sourceImages.map((src,i)=>`<img alt="Página original ${i+12} del CLE" src="${src}">`).join('')}</details>${voiceButton(POEM,'🔊 ESCUCHAR EL POEMA')}`}h+='</section>'}
h+=`<p id="alert" role="status" aria-live="polite" class="feedback"></p><p class="footer">Escuela 37 · Recursos de apoyo para el aula · Actividades individuales. La validación de explicaciones orales y escritas corresponde a la docente. El progreso queda guardado en este dispositivo, cuando el navegador lo permite.</p>`;
$('#app').innerHTML=h;applyUppercase();bind();}
function record(stage){const r=route();if(stage.startsWith('diagnostic'))return r.diagnostic[Number(stage.slice('diagnostic'.length))];if(stage==='mini')return r.mini;if(stage.startsWith('practice'))return r.practice[+(stage.slice(-1))];return null}
function task(stage){if(stage.startsWith('diagnostic'))return DIAGNOSTICS[state.student][state.area][Number(stage.slice('diagnostic'.length))];if(stage==='mini')return lesson().mini;if(stage.startsWith('practice'))return practiceTask(Number(stage.slice('practice'.length)))}
function stageCorrect(t,sel){if(t.kind==='multi')return sel.length===t.answers.length&&sel.every(x=>t.answers.includes(x));return sel[0]===t.answer}
function finishTask(stage,rec,ok){if(stage.startsWith('diagnostic')&&rec.first===null)rec.first={selected:[...rec.selected],correct:ok,when:new Date().toISOString()};rec.attempts++;if(ok){rec.completed=true;rec.rounds++;rec.replay=false;rec.correct=ok;rec.hint=false;route().log.push({stage,correct:ok,round:rec.rounds,when:new Date().toISOString()})}else{rec.hint=true}save();render();flash(ok?'¡Bien! Puedes practicar otra vez o seguir.':'No coincide todavía. Mira la pista y vuelve a intentar.',!ok&&stage!=='diagnostic')}
function check(stage){const rec=record(stage),t=task(stage);if(!rec||!t)return;if(rec.completed&&!rec.replay)return;if(t.kind==='stepper'){if(rec.step===t.steps){finishTask(stage,rec,true)}else flash('Aún quedan saltos por completar.',true);return}if(!rec.selected||!rec.selected.length){flash('Toca una respuesta antes de comprobar.',true);return}finishTask(stage,rec,stageCorrect(t,rec.selected))}
function pick(stage,value){const rec=record(stage),t=task(stage);if(!rec||!t)return;if(rec.completed&&!rec.replay)return;if(t.kind==='stepper'){const expected=t.start+t.delta*(rec.step+1);rec.attempts++;if(Number(value)===expected){rec.step++;rec.hint=false;if(rec.step===t.steps){rec.completed=true;rec.rounds++;rec.replay=false;rec.correct=true;route().log.push({stage,correct:true,round:rec.rounds,attempts:rec.attempts,when:new Date().toISOString()})}}else rec.hint=true;save();render();flash(Number(value)===expected?'¡Ese salto corresponde! '+(rec.completed?'¡Terminaste los siete!':'Seguimos.'):'Ese salto todavía no corresponde. Vuelve a contar desde el último número.',Number(value)!==expected);return}const v=rec.selected||[];rec.selected=t.kind==='multi'?(v.includes(value)?v.filter(x=>x!==value):[...v,value]):[value];save();render()}
function repeat(stage){const rec=record(stage);if(!rec||!rec.completed)return;rec.replay=true;rec.selected=[];rec.step=0;rec.hint=false;save();render();flash('Puedes resolver la misma actividad otra vez. Tu estrella y el primer intento se conservan.')}
function exportData(){const r=state.progress;const payload={version:6,fecha:'2026-10-13',origen:APP.mode,student:state.student,registros:r,fecha_exportacion:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='Estaciones37_Martes13_registro_'+state.student+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function bind(){document.querySelectorAll('[data-speech]').forEach(b=>b.addEventListener('click',()=>listen(b.dataset.speech)));document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.stage,b.dataset.choice)));document.querySelectorAll('[data-self]').forEach(b=>b.addEventListener('click',()=>{route().self.choice=b.dataset.self;save();render()}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const op=b.dataset.action,st=b.dataset.stage;if(op==='check')check(st);if(op==='repeat')repeat(st);if(op==='help'){const rec=record(st);if(rec){rec.hint=true;save();render();listen(task(st).help||lesson().bridge||'Mira el ejemplo y prueba nuevamente')}}if(op==='toggle-voice'){state.voice=!state.voice;if(!state.voice&&'speechSynthesis'in window)speechSynthesis.cancel();save();render()}if(op==='reset'){if(window.confirm(isCaps()?'¿QUIERES REINICIAR SOLO ESTA ASIGNATURA? SE BORRARÁN SUS ESTRELLAS Y RESPUESTAS GUARDADAS. LAS OTRAS ACTIVIDADES NO SE BORRARÁN.':'¿Quieres reiniciar solo esta asignatura? Se borrarán sus estrellas y respuestas guardadas. Las otras actividades no se borrarán.')){state.progress[key()]=newRoute();save();window.scrollTo(0,0);render()}}if(op==='save-self'){const r=route();if(!r.self.choice){flash('Primero elige una de las tres imágenes de autoevaluación.',true);return}r.self.text=$('#reflectText')?.value||r.self.text||'';if(isCaps())r.self.text=r.self.text.toLocaleUpperCase('es-UY');r.self.saved=true;r.self.status='pendiente_revision_docente';r.log.push({stage:'AUTOEVALUACION',choice:r.self.choice,when:new Date().toISOString()});save();render();flash('Tu autoevaluación quedó registrada. ¡Gracias por decir cómo aprendiste!')}if(op==='export')exportData();if(op==='next-area'){state.area=state.area==='lengua'?'matematica':'lengua';save();window.scrollTo(0,0);render()}}));const p=$('#person');if(p)p.onchange=()=>{state.student=p.value;save();window.scrollTo(0,0);render()};const a=$('#subject');if(a)a.onchange=()=>{state.area=a.value;save();window.scrollTo(0,0);render()};const tx=$('#reflectText');if(tx)tx.oninput=()=>{if(isCaps()){const pos=tx.selectionStart;tx.value=tx.value.toLocaleUpperCase('es-UY');tx.setSelectionRange(pos,pos);}route().self.text=tx.value;save()}}
render();
</script></body></html>
